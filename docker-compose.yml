services:
  vector-db:
    image: qdrant/qdrant
    container_name: QdrantDB
    ports:
      - 6333:6333
    volumes:
      - ./qdrant_storage:/qdrant/storage 
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
  
  
volumes:
    redis_data:
